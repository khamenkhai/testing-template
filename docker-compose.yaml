version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PORT: ${PORT}
    container_name: nest-api
    ports:
      - '${PORT}:${PORT}'
    env_file:
      - .env
    environment:
      DB_HOST: db
    command: sh -c "npx prisma migrate deploy && node dist/src/main"
    depends_on:
      db:
        condition: service_healthy
    restart: always

  db:
    image: postgres:15-alpine
    container_name: nest_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 5s
      timeout: 5s
      retries: 5

  dbgate:
    image: dbgate/dbgate:latest
    container_name: nest_dbgate
    restart: always
    ports:
      - '3000:3000'
    volumes:
      - dbgate_data:/home/dbgate/.dbgate
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  dbgate_data:
